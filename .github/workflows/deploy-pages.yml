name: Deploy My Tracker (from zip) to GitHub Pages

# طريقة الاستخدام:
# 1) ارفع my-tracker.zip في جذر الريبو (Add file → Upload files).
# 2) من Settings → Pages → Source: اختر "GitHub Actions" (مرة واحدة فقط).
# 3) كل رفع جديد لـ my-tracker.zip يشغّل هذا الـworkflow تلقائيًا.

on:
  push:
    branches: [main, master]
    paths:
      - "my-tracker.zip"
      - "**/my-tracker.zip"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        id: locate-zip
        run: |
          ZIP_PATH=$(find . -maxdepth 3 -iname "*.zip" -not -path "./.git/*" | head -n1)
          if [ -z "$ZIP_PATH" ]; then
            echo "::error::No ZIP file found in repository (searched up to 3 levels)."
            exit 1
          fi
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Extract project
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q "${{ steps.locate-zip.outputs.zip_path }}" -d extracted

      - name: Find project directory
        id: locate-app
        run: |
          if [ -f "extracted/package.json" ]; then
            APP_DIR="extracted"
          else
            APP_DIR=$(find extracted -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n1 | xargs dirname)
          fi
          if [ -z "$APP_DIR" ]; then
            echo "::error::package.json not found inside the zip."
            exit 1
          fi
          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "Project found at: $APP_DIR"

      # بلا cache: npm — خيار الكاش كان يسبب "unable to cache dependencies"
      # عندما يكون lockfile داخل مجلد مستخرج. npm ci بدون كاش أبطأ قليلًا
      # لكنه مضمون ولا يفشل بسبب مسارات.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ steps.locate-app.outputs.app_dir }}
        run: npm ci --no-audit --no-fund

      - name: Determine Vite base path
        id: base-path
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            BASE_PATH="/"
          else
            BASE_PATH="/${REPO_NAME}/"
          fi
          echo "base_path=$BASE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build project
        working-directory: ${{ steps.locate-app.outputs.app_dir }}
        env:
          VITE_BASE_PATH: ${{ steps.base-path.outputs.base_path }}
        run: npm run build

      - name: Verify build output
        run: |
          BUILD_DIR="${{ steps.locate-app.outputs.app_dir }}/build"
          if [ ! -f "$BUILD_DIR/index.html" ]; then
            echo "::error::Build failed: build/index.html missing."
            exit 1
          fi

      - name: Create SPA fallback
        run: |
          BUILD_DIR="${{ steps.locate-app.outputs.app_dir }}/build"
          touch "$BUILD_DIR/.nojekyll"
          cp "$BUILD_DIR/index.html" "$BUILD_DIR/404.html"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.locate-app.outputs.app_dir }}/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
