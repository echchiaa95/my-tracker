name: Deploy My Tracker (any zip) to GitHub Pages

# workflow موحد — يعمل مع أي ملف ZIP مهما كان اسمه:
#   my-tracker.zip / my-tracker(1).zip / app.zip / أي اسم آخر.
# - يشتغل تلقائيًا عند رفع أو تعديل أي ملف .zip في الريبو (أي مجلد).
# - يبحث عن أحدث zip (حتى عمق 4 مستويات) ويفك ضغطه.
# - يتحقق من سلامة الـzip قبل فك الضغط برسالة عربية واضحة.
# - يجد مجلد المشروع تلقائيًا (سواء كان على جذر الـzip أو داخل مجلد فرعي).
# يمكن تشغيله يدويًا: Actions → Deploy My Tracker → Run workflow.

on:
  push:
    branches: [main, master]
    paths:
      - "*.zip"
      - "**/*.zip"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file (any name)
        id: locate-zip
        run: |
          # أحدث ملف zip في الريبو (بأي اسم، حتى عمق 4 مستويات)
          ZIP_PATH=$(find . -maxdepth 4 -iname "*.zip" -not -path "./.git/*" -printf '%T@ %p\n' \
            | sort -rn | head -n1 | cut -d' ' -f2-)
          if [ -z "$ZIP_PATH" ]; then
            echo "::error::لم يتم العثور على أي ملف zip في الريبو. ارفع الملف المضغوط أولًا."
            exit 1
          fi
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "تم العثور على: $ZIP_PATH"

      - name: Verify ZIP integrity
        run: |
          # فحص سلامة الملف قبل فك الضغط — يكشف الرفع الناقص برسالة واضحة
          # بدل خطأ unzip الغامض "End-of-central-directory signature not found".
          if ! unzip -t "${{ steps.locate-zip.outputs.zip_path }}" > /dev/null 2>&1; then
            echo "::error::الملف المضغوط تالف أو ناقص (غالبًا توقف التنزيل أو الرفع قبل اكتماله). الحل: احذف الملف من الريبو، أعد تنزيله من المصدر، وتأكد من اكتمال شريط الرفع قبل الضغط على Commit."
            exit 1
          fi
          echo "الملف سليم."

      - name: Extract project
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q "${{ steps.locate-zip.outputs.zip_path }}" -d extracted

      - name: Find project directory
        id: locate-app
        run: |
          # يقبل الحالتين: ملفات المشروع على جذر الـzip، أو داخل مجلد فرعي.
          if [ -f "extracted/package.json" ]; then
            APP_DIR="extracted"
          else
            APP_DIR=$(find extracted -maxdepth 4 -name "package.json" -not -path "*/node_modules/*" | head -n1 | xargs dirname)
          fi
          if [ -z "$APP_DIR" ]; then
            echo "::error::لم أجد package.json داخل الـzip. تأكد أن الملف يحتوي مشروع Vite كاملًا."
            exit 1
          fi
          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "مجلد المشروع: $APP_DIR"

      # بلا cache: npm — خيار الكاش يسبب "unable to cache dependencies"
      # عندما يكون lockfile داخل مجلد مستخرج. npm ci بدون كاش مضمون.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ steps.locate-app.outputs.app_dir }}
        run: npm ci --no-audit --no-fund

      - name: Determine Vite base path
        id: base-path
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          # صفحة مستخدم/منظمة (username.github.io) تُنشر على الجذر "/".
          if [[ "$REPO_NAME" == *.github.io ]]; then
            BASE_PATH="/"
          else
            BASE_PATH="/${REPO_NAME}/"
          fi
          echo "base_path=$BASE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build project
        working-directory: ${{ steps.locate-app.outputs.app_dir }}
        env:
          VITE_BASE_PATH: ${{ steps.base-path.outputs.base_path }}
        run: npm run build

      - name: Verify build output
        run: |
          BUILD_DIR="${{ steps.locate-app.outputs.app_dir }}/build"
          if [ ! -f "$BUILD_DIR/index.html" ]; then
            echo "::error::فشل البناء: لا يوجد build/index.html. راجع سجل خطوة Build أعلاه."
            exit 1
          fi

      - name: Create SPA fallback
        run: |
          # GitHub Pages بلا server rewrite: نسخ index.html كـ 404.html حتى
          # يعمل React Router عند فتح مسار داخلي مباشرة أو عمل Refresh.
          BUILD_DIR="${{ steps.locate-app.outputs.app_dir }}/build"
          touch "$BUILD_DIR/.nojekyll"
          cp "$BUILD_DIR/index.html" "$BUILD_DIR/404.html"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.locate-app.outputs.app_dir }}/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
